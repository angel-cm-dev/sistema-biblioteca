# Levanta todo el sistema con un solo comando:  docker compose up --build
# Frontend: http://localhost:8080   ·   API/Swagger: http://localhost:8000/docs
name: sistema-biblioteca

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/biblioteca.db}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-minimo-32-caracteres}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      FINE_PER_DAY: ${FINE_PER_DAY:-1.00}
      DEBT_BLOCK_THRESHOLD: ${DEBT_BLOCK_THRESHOLD:-10.00}
      RESERVATION_HOLD_DAYS: ${RESERVATION_HOLD_DAYS:-3}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: docker
    volumes:
      - biblioteca-data:/app/data # la base SQLite sobrevive a reinicios y recreaciones
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  biblioteca-data:
