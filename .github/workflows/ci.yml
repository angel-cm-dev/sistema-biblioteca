name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas (SQLite en memoria, sin Docker)
        run: pytest --cov=app --cov-report=term-missing
      - name: Build de la imagen Docker
        if: matrix.python-version == '3.12'
        run: docker build -t sistema-biblioteca-backend .

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Build de la imagen Docker
        run: docker build -t sistema-biblioteca-frontend .
